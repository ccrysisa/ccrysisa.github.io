# =====================================================================================
# It's recommended to use Alternate Theme Config to configure FixIt
# Modifying this file may result in merge conflict
# There are currently some restrictions to what a theme component can configure:
# params, menu(s), outputformats and mediatypes
# =====================================================================================

# -------------------------------------------------------------------------------------
# Hugo Configuration
# See: https://gohugo.io/configuration/all/
# -------------------------------------------------------------------------------------

# website title
title = "KZnight's Blog"
# Hostname (and path) to the root
baseURL = "https://ccrysisa.github.io/"
# theme list
# 更改使用 Hugo 构建网站时使用的默认主题
theme = ["FixIt"] # enable in your site config file
# 设置默认的语言 ["en", "zh-cn", "fr", "pl", ...]
# determines default content language ["en", "zh-cn", "fr", "pl", ...]
defaultContentLanguage = "en"
# 网站语言，仅在这里 CN 大写 ["en", "zh-CN", "fr", "pl", ...]
# language code ["en", "zh-CN", "fr", "pl", ...]
languageCode = "en"
# language name ["English", "简体中文", "Français", "Polski", ...]
languageName = "English"
# whether to include Chinese/Japanese/Korean
# 是否包括中日韩文字
hasCJKLanguage = true

# default amount of posts in each pages
pagination.pagerSize = 12
# copyright description used only for seo schema
copyright = ""
# whether to use robots.txt
enableRobotsTXT = true
# whether to use git commit log
enableGitInfo = true
# whether to use emoji code
enableEmoji = true
# the main sections of a site
# if set, the MainSections method on the Site object returns the given sections,
# otherwise it returns the section with the most pages.
# mainSections = ["posts"]

# -------------------------------------------------------------------------------------
# Front Matter Configuration
# See: https://gohugo.io/configuration/front-matter/
# -------------------------------------------------------------------------------------

[frontmatter]
_merge = "shallow"
lastmod = [
  "lastmod",
  ":git", 
  ":fileModTime",
  ":default",
]

# -------------------------------------------------------------------------------------
# Imaging Configuration
# See: https://gohugo.io/configuration/imaging/
# -------------------------------------------------------------------------------------

[imaging]
_merge = "shallow"
quality = 75

# -------------------------------------------------------------------------------------
# Menu Configuration
# See: https://fixit.lruihao.cn/documentation/basics/#menu-configuration
# -------------------------------------------------------------------------------------

[menus]

[[menus.main]]
identifier = "posts"
parent = ""
# you can add extra information before the name (HTML format is supported), such as icons
pre = ""
# you can add extra information after the name (HTML format is supported), such as icons
post = ""
name ="Posts"
url = "/posts/"
# title will be shown when you hover on this menu link
title = ""
weight = 1

# FixIt 0.2.14 | NEW add user-defined content to menu items
[menus.main.params]
# add css class to a specific menu item
class = ""
# whether set as a draft menu item whose function is similar to a draft post/page
draft = false
# FixIt 0.2.16 | NEW add fontawesome icon to a specific menu item
icon = "fa-solid fa-archive"
# FixIt 0.2.16 | NEW set menu item type, optional values: ["mobile", "desktop"]
type = ""
# FixIt 0.3.9 | NEW whether to show the submenu item divider line
divided = false

[[menus.main]]
identifier = "categories"
parent = ""
pre = ""
post = ""
name = "Categories"
url = "/categories/"
title = ""
weight = 2

[menus.main.params]
icon = "fa-solid fa-folder-tree"

[[menus.main]]
identifier = "collections"
parent = ""
pre = ""
post = ""
name = "Collections"
url = "/collections/"
title = ""
weight = 3

[menus.main.params]
icon = "fa-solid fa-layer-group"

[[menus.main]]
identifier = "tags"
parent = ""
pre = ""
post = ""
name = "Tags"
url = "/tags/"
title = ""
weight = 4

[menus.main.params]
icon = "fa-solid fa-tags"

[[menus.main]]
identifier = "friends"
parent = ""
pre = ""
post = ""
name = "Friends"
url = "/friends/"
title = ""
weight = 5

[menus.main.params]
# icon = "fa-solid fa-user-group"
icon = "fa-solid fa-blog"

# -------------------------------------------------------------------------------------
# Related content Configuration
# See: https://gohugo.io/content-management/related-content/
# -------------------------------------------------------------------------------------

[related]
includeNewer = false
threshold = 80
toLower = false

[[related.indices]]
applyFilter = false
cardinalityThreshold = 0
name = 'keywords'
pattern = ''
toLower = false
type = 'basic'
weight = 100

[[related.indices]]
applyFilter = false
cardinalityThreshold = 0
name = 'date'
pattern = ''
toLower = false
type = 'basic'
weight = 10

[[related.indices]]
applyFilter = false
cardinalityThreshold = 0
name = 'tags'
pattern = ''
toLower = false
type = 'basic'
weight = 80

[[related.indices]]
applyFilter = false
name = 'fragmentrefs'
type = 'fragments'
weight = 80

# -------------------------------------------------------------------------------------
# Modules Configuration
# See: https://gohugo.io/configuration/module/
# -------------------------------------------------------------------------------------

[module]

[module.hugoVersion]
extended = true
min = "0.147.7"

# -------------------------------------------------------------------------------------
# Markup Configuration
# See: https://gohugo.io/configuration/markup/
# -------------------------------------------------------------------------------------

# Hugo 解析文档的配置
[markup]
_merge = "shallow"

# Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
# 语法高亮设置 (https://gohugo.io/content-management/syntax-highlighting)
[markup.highlight]
# ~~~~~~~~~~ necessary configurations ~~~~~~~~~~
################## 必要的配置 ##################
# https://github.com/hugo-fixit/FixIt/issues/43
codeFences = true
noClasses = false
# ~~~~~~~~~~ necessary configurations ~~~~~~~~~~
################## 必要的配置 ##################
anchorLineNos = false
guessSyntax = true
lineNos = true
lineNumbersInTable = true

# Goldmark is from Hugo 0.60 the default library used for Markdown
# Goldmark 是 Hugo 0.60 以来的默认 Markdown 解析库
# See: https://gohugo.io/configuration/markup/#goldmark
[markup.goldmark]
duplicateResourceFiles = false

[markup.goldmark.extensions]
definitionList = true
footnote = true
linkify = true
linkifyProtocol = 'https'
# strikethrough = true
strikethrough = false
table = true
taskList = true
typographer = true

# See: https://gohugo.io/configuration/markup/#extras
[markup.goldmark.extensions.extras]

[markup.goldmark.extensions.extras.delete]
enable = true

[markup.goldmark.extensions.extras.insert]
enable = true

[markup.goldmark.extensions.extras.mark]
enable = true

[markup.goldmark.extensions.extras.subscript]
enable = true

[markup.goldmark.extensions.extras.superscript]
enable = true

# https://gohugo.io/content-management/mathematics/
[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [
  [
    '\[',
    '\]'
  ],
  [
    '$$',
    '$$'
  ]
]
inline = [
  [
    '\(',
    '\)'
  ],
  [
    '$',
    '$'
  ]
]

[markup.goldmark.parser]

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.goldmark.renderer]
hardWraps = false
# whether to use HTML tags directly in the document
# 是否在文档中直接使用 HTML 标签
unsafe = true
xhtml = false
# hardWraps = true

# # 目录设置
# [markup.tableOfContents]
# startLevel = 2
# endLevel = 5

# -------------------------------------------------------------------------------------
# Sitemap Configuration
# See: https://gohugo.io/templates/sitemap/#configuration
# -------------------------------------------------------------------------------------

[sitemap]
changefreq = "weekly"
disable = false
filename = "sitemap.xml"
priority = 0.5

# -------------------------------------------------------------------------------------
# Permalinks Configuration
# See: https://gohugo.io/content-management/urls/#permalinks
# -------------------------------------------------------------------------------------

[Permalinks]
# posts = ":year/:month/:contentbasename"
# posts = ":contentbasename"
posts = ":sections/:contentbasename"

[permalinks.page]
# posts = "/p/:slugorcontentbasename"

[permalinks.section]
# posts = "/posts/:slugorcontentbasename"

[permalinks.taxonomy]

[permalinks.term]

# -------------------------------------------------------------------------------------
# Privacy Configuration
# See: https://gohugo.io/configuration/privacy/
# -------------------------------------------------------------------------------------

[privacy]

[privacy.x]
enableDNT = true

[privacy.youtube]
privacyEnhanced = true

# -------------------------------------------------------------------------------------
# Media Types Configuration
# See: https://gohugo.io/configuration/media-types/
# -------------------------------------------------------------------------------------

[mediaTypes]
# [mediaTypes."application/feed+json"]
# suffixes = ["json"]

# 用于输出 Markdown 格式文档的设置
[mediaTypes."text/markdown"]
suffixes = ["md"]

# 用于输出 txt 格式文档的设置
[mediaTypes."text/plain"]
suffixes = ["txt"]

# -------------------------------------------------------------------------------------
# Output Format Configuration
# See: https://gohugo.io/configuration/output-formats/
# -------------------------------------------------------------------------------------

[outputFormats]

# FixIt 0.3.0 | NEW Options to make output /archives/index.html file
[outputFormats.archives]
path = "archives"
baseName = "index"
mediaType = "text/html"
isPlainText = false
isHTML = true
permalinkable = true
notAlternative = true

# FixIt 0.3.0 | NEW Options to make output /offline/index.html file
[outputFormats.offline]
path = "offline"
baseName = "index"
mediaType = "text/html"
isPlainText = false
isHTML = true
permalinkable = true
notAlternative = true

# FixIt 0.3.0 | NEW Options to make output readme.md file
[outputFormats.readme]
baseName = "readme"
mediaType = "text/markdown"
isPlainText = true
isHTML = false
notAlternative = true

# FixIt 0.3.0 | CHANGED Options to make output baidu_urls.txt file
[outputFormats.baidu_urls]
baseName = "baidu_urls"
mediaType = "text/plain"
isPlainText = true
isHTML = false
notAlternative = true

# FixIt 0.3.10 | NEW Options to make output search.json file
[outputFormats.search]
baseName = "search"
mediaType = "application/json"
rel = "search"
isPlainText = true
isHTML = false
permalinkable = true

# # 用于输出 Markdown 格式文档的设置
# [outputFormats.MarkDown]
# mediaType = "text/markdown"
# isPlainText = true
# isHTML = false

# #  用于输出 baidu_urls.txt 文件的设置
# [outputFormats.BaiduUrls]
# baseName = "baidu_urls"
# mediaType = "text/plain"
# isPlainText = true
# isHTML = false

# -------------------------------------------------------------------------------------
# Output Configuration
# See: https://gohugo.io/configuration/outputs/
# -------------------------------------------------------------------------------------

# Options to make hugo output files, the optional values are below:
# home = ["html", "rss", "archives", "offline", "readme", "baidu_urls", "search"]
# page = ["html", "markdown"]
# section = ["html", "rss"]
# taxonomy = ["html"]
# term = ["html", "rss"]
[outputs]
_merge = "shallow"
home = [
  "html",
  "rss",
  "archives",
  "offline",
  "search"
]
page = [
  "html",
  "markdown"
]
section = [
  "html",
  "rss"
]
taxonomy = [ "html" ]
term = [
  "html",
  "rss"
]

# -------------------------------------------------------------------------------------
# Taxonomies Configuration
# See: https://gohugo.io/configuration/taxonomies/
# -------------------------------------------------------------------------------------

[taxonomies]
_merge = "shallow"
category = "categories"
tag = "tags"
collection = "collections"


# -------------------------------------------------------------------------------------
# Theme Core Configuration
# See: https://fixit.lruihao.cn/documentation/basics/#theme-configuration
# -------------------------------------------------------------------------------------

[params]
# FixIt 0.2.15 | CHANGED FixIt theme version
#  FixIt 主题版本
version = "0.4.X" # 例如："0.2.X", "0.2.15", "v0.2.15" 等
# site description
# 网站描述
description = "这是我的 Hugo FixIt 博客网站"
# site keywords
# 网站关键词
keywords = ["Hugo", "FixIt"]
# site default theme ["light", "dark", "auto"]
# 网站默认主题样式 ["light", "dark", "auto"]
defaultTheme = "auto"
# which hash function used for SRI, when empty, no SRI is used
#  哪种哈希函数用来 SRI, 为空时表示不使用 SRI
# ["sha256", "sha384", "sha512", "md5"]
fingerprint = ""
# date format
#  日期格式
dateFormat = "2006-01-02"
# website images for Open Graph and Twitter Cards
# 网站图片，用于 Open Graph 和 Twitter Cards
images = ["/logo.png"]
# FixIt 0.2.12 | NEW enable PWA
#  开启 PWA 支持
enablePWA = true
# FixIt 0.2.14 | NEW whether to add external Icon for external links automatically
#  是否自动显示外链图标
externalIcon = false
# FixIt 0.3.13 | NEW whether to capitalize titles
capitalizeTitles = true
# FixIt 0.3.0 | NEW whether to add site title to the title of every page
# remember to set up your site title in `hugo.toml` (e.g. title = "title")
withSiteTitle = true
# FixIt 0.3.0 | NEW title delimiter when the site title is be added to the title of every page
titleDelimiter = "-"
# FixIt 0.3.0 | NEW whether to add site subtitle to the title of index page
# remember to set up your site subtitle by `params.header.subtitle.name`
indexWithSubtitle = false
# FixIt 0.3.13 | NEW whether to show summary in plain text
summaryPlainify = false
# FixIt 0.4.0 | NEW whether to enable merging missing translations from other languages
# when set to true, missing translations from other languages will be merged and displayed
# default is false for better performance, especially for single-language sites
# set to true if your site has multiple languages and you want to show all content
enableTranslationMerge = false
# FixIt 0.2.14 | NEW FixIt will, by default, inject a theme meta tag in the HTML head on the home page only.
# You can turn it off, but we would really appreciate if you don’t, as this is a good way to watch FixIt's popularity on the rise.
# 默认情况下，FixIt 只会在主页的 HTML 头中注入主题元标记
# 您可以将其关闭，但如果您不这样做，我们将不胜感激，因为这是观察 FixIt 受欢迎程度上升的好方法
disableThemeInject = false

# Author Configuration
# 作者配置
[params.author]
name = "ccrysisa"
email = "gshinevon@gmail.com"
link = "https://github.com/ccrysisa"
avatar = "https://avatars.githubusercontent.com/u/133117003?s=96&v=4"

# FixIt 0.3.0 | NEW public Git repository information only then enableGitInfo is true
[params.gitInfo]
# e.g. "https://github.com/hugo-fixit/docs"
repo = ""
branch = "main"
# the content directory path relative to the root of the repository
dir = "content"
# the issue template for reporting issue of the posts
# available template params: {title} {URL} {sourceURL}
issueTpl = "title=[BUG]%20{title}&body=|Field|Value|%0A|-|-|%0A|Title|{title}|%0A|URL|{URL}|%0A|Filename|{sourceURL}|"

# App icon config
# 应用图标配置
[params.app]
# optional site title override for the app when added to an iOS home screen or Android launcher
# 当添加到 iOS 主屏幕或者 Android 启动器时的标题，覆盖默认标题
title = "FixIt"
# whether to omit favicon resource links
# 是否隐藏网站图标资源链接
noFavicon = false
# modern SVG favicon to use in place of older style .png and .ico files
# 更现代的 SVG 网站图标，可替代旧的 .png 和 .ico 文件
svgFavicon = ""
# Safari mask icon color
# Safari 图标颜色
iconColor = "#5bbad5"
# Windows v8-10 tile color
# Windows v8-10 磁贴颜色
tileColor = "#da532c"

# FixIt 0.2.12 | CHANGED Android browser theme color
# Android 浏览器主题色
[params.app.themeColor]
light = "#f8f8f8"
dark = "#252627"

# Search config
# 搜索配置
[params.search]
enable = false
# type of search engine ["algolia", "fuse", "cse", "post-chat"]
type = "fuse"
# max index length of the chunked content
# 文章内容最长索引长度
contentLength = 4000
# placeholder of the search bar
# 搜索框的占位提示语
placeholder = ""
# max number of results length
# 最大结果数目
maxResultLength = 10
# snippet length of the result
# 结果内容片段长度
snippetLength = 50
# HTML tag name of the highlight part in results
# 搜索结果中高亮部分的 HTML 标签
highlightTag = "em"
# whether to use the absolute URL based on the baseURL in search index
# 是否在搜索索引中使用基于 baseURL 的绝对路径
absoluteURL = false
# FixIt 0.4.0 | NEW whether to enable anchorify for headings in search results
anchorify = true


[params.search.algolia]
index = ""
appID = ""
searchKey = ""

# FixIt 0.2.17 | NEW https://fusejs.io/api/options.html
[params.search.fuse]
#  https://fusejs.io/api/options.html
isCaseSensitive = false
minMatchCharLength = 2
findAllMatches = false
location = 0
threshold = 0.3
distance = 100
ignoreLocation = false
useExtendedSearch = false
ignoreFieldNorm = false

# FixIt 0.3.16 | NEW Custom Search Engine (CSE)
[params.cse]
# Search Engine: ["google", "bing"]
engine = ""
# Search results page URL (layout: search)
resultsPage = "/search/"

# Google: https://programmablesearchengine.google.com/
# Google Custom Search Engine Context
[params.cse.google]
cx = ""

# Bing (Unsupported): https://www.customsearch.ai/
[params.cse.bing]

# Header config
# 页面头部导航栏配置
[params.header]
# FixIt 0.2.13 | CHANGED desktop header mode ["sticky", "normal", "auto"]
#  桌面端导航栏模式 ["sticky", "normal", "auto"]
desktopMode = "sticky"
# FixIt 0.2.13 | CHANGED mobile header mode ["sticky", "normal", "auto"]
#  移动端导航栏模式 ["sticky", "normal", "auto"]
mobileMode = "auto"

# Header title config
#  页面头部导航栏标题配置
[params.header.title]
# URL of the LOGO
# LOGO 的 URL
logo = "/fixit.min.svg"
# title name
# 标题名称
name = "KZnight's Blog"
# you can add extra information before the name (HTML format is supported), such as icons
# 你可以在名称（允许 HTML 格式）之前添加其他信息，例如图标
pre = ""
# you can add extra information after the name (HTML format is supported), such as icons
# 你可以在名称（允许 HTML 格式）之后添加其他信息，例如图标
post = ""
# whether to use typeit animation for title name
#  是否为标题显示打字机动画
typeit = false

# FixIt 0.2.12 | NEW Header subtitle config
#  页面头部导航栏副标题配置
[params.header.subtitle]
# subtitle name
# 副标题名称
name = ""
# whether to use typeit animation for subtitle name
# 是否为副标题显示打字机动画
typeit = false

# FixIt 0.2.18 | NEW Breadcrumb config
#  面包屑导航配置
[params.breadcrumb]
enable = false
sticky = false
showHome = false
# FixIt 0.3.13 | NEW
separator = "/"
capitalize = true

# FixIt 0.3.10 | NEW Post navigation config
[params.navigation]
# whether to show the post navigation in section pages scope
inSection = false
# whether to reverse the next/previous post navigation order
reverse = false

# Footer config
# 页面底部信息配置
[params.footer]
enable = true
# whether to show copyright info
#  是否显示版权信息
copyright = true
# whether to show the author
#  是否显示作者
author = true
# Site creation year
# 网站创立年份
since = "2023"
#  是否显示网站内容总字数
wordCount = true
# FixIt 0.2.12 | NEW Public network security only in China (HTML format is supported)
#  公网安备信息，仅在中国使用（支持 HTML 格式）
gov = ""
# ICP info only in China (HTML format is supported)
#  ICP 备案信息，仅在中国使用（支持 HTML 格式）
icp = ""
# license info (HTML format is supported)
# 许可协议信息（支持 HTML 格式）
license = '<a rel="license external nofollow noopener noreferrer" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a>'

# FixIt 0.3.0 | NEW whether to show Hugo and theme info
[params.footer.powered]
enable = true
hugoLogo = true
themeLogo = true

# FixIt 0.2.17 | CHANGED Site creation time
#  网站创立时间
[params.footer.siteTime]
enable = false
animate = true
icon = "fa-solid fa-heartbeat"
pre = ""
value = ""                     # e.g. "2021-12-18T16:15:22+08:00"

# FixIt 0.2.17 | NEW footer lines order, optional values: ["first", 0, 1, 2, 3, 4, 5, "last"]
#  页面底部行排序，可选值：["first", 0, 1, 2, 3, 4, 5, "last"]
[params.footer.order]
powered = 0
copyright = 0
statistics = 0
visitor = 0
beian = 0

# FixIt 0.3.0 | NEW Archives page config (all pages of posts type)
[params.archives]
# special amount of posts in archives page
paginate = 20
# date format (month and day)
dateFormat = "01-02"

# Section page config (all pages in section)
#  Section（所有文章）页面配置
[params.section]
# special amount of pages in each section page
# section 页面每页显示文章数量
paginate = 20
# date format (month and day)
# 日期格式（月和日）
dateFormat = "01-02"
# # RSS 文章数目
# rss = 10
# #  最近更新文章设置
# 
# [params.section.recentlyUpdated]
# enable = true
# rss = false
# days = 30
# maxCount = 10

# FixIt 0.3.10 | NEW Section feed config for RSS, Atom and JSON feed.
[params.section.feed]
# The number of posts to include in the feed. If set to -1, all posts.
limit = -1
# whether to show the full text content in feed.
fullText = false

# Term list (category or tag) page config

#  List（目录或标签）页面配置
[params.list]
# special amount of posts in each list page
# list 页面每页显示文章数量
paginate = 20
# date format (month and day)
# 日期格式（月和日）
dateFormat = "01-02"
# # RSS 文章数目
# rss = 10

# FixIt 0.3.10 | NEW Term list feed config for RSS, Atom and JSON feed.
[params.list.feed]
# The number of posts to include in the feed. If set to -1, all posts.
limit = -1
# whether to show the full text content in feed.
fullText = false

# FixIt 0.3.13 | NEW recently updated pages config for archives, section and term list
[params.recentlyUpdated]
archives = true
section = true
list = true
days = 30
maxCount = 10

# FixIt 0.2.17 | NEW TagCloud config for tags page
#  标签云配置
[params.tagcloud]
enable = false
min = 14         # 最小字体大小，单位：px
max = 32         # 最大字体大小，单位：px
peakCount = 10   # 每个标签的最大文章数
orderby = "name" # 标签排序方式，可选值：["name", "count"]

# Home page config
# 主页配置

[params.home]
# #  RSS 文章数目
# rss = 10

# Home page profile
# 主页个人信息
[params.home.profile]
enable = true
# FixIt 0.4.0 | NEW Whether to show profile and content only in the first home page
onlyFirstPage = false
# Gravatar Email for preferred avatar in home page
# Gravatar 邮箱，用于优先在主页显示的头像
gravatarEmail = ""
# URL of avatar shown in home page, default is author's avatar
# 主页显示头像的 URL
avatarURL = "/images/avatar.png"
# FixIt 0.2.17 | NEW identifier of avatar menu link
#  头像菜单链接的 identifier
avatarMenu = ""
# title shown in home page (HTML format is supported)
#  主页显示的网站标题（支持 HTML 格式）
